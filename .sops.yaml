# Naming convention for the anchors below:
#
#   <user>_<host>  a person's user key   — ~/.ssh/id_ed25519 on that machine,
#                                          used by Home Manager sops
#   host_<host>    a machine's host key  — /persist/etc/ssh/ssh_host_ed25519_key,
#                                          used by system (NixOS) sops
#
# One anchor per host per context, even where two hosts share the same key —
# sops deduplicates identical recipients, so the duplication costs nothing and
# keeps it obvious which machines can decrypt.
#
# Derive a key with:  nix run .#fetchkeys -- <user>@<host>
# After editing, re-encrypt:  sops updatekeys secrets/secrets.yaml

keys:
  # user keys
  - &hcvst_uwshc   age1re53jflrhfmdd0s3zzae6jd8wzvpxz3p7u4rgcajngdmg8qf95kqlvg4cr
  - &hcvst_sheba   age1re53jflrhfmdd0s3zzae6jd8wzvpxz3p7u4rgcajngdmg8qf95kqlvg4cr # same key as uwshc
  - &hcvst_ultkv   age1p7hkzkr92kmjl0wm48pjhjd9v329k4x4udmeem8ztpvvqs3vqv8qw029wu
  - &hcvst_generic age1lk4kt296ypzaztk3e3p5w9r7gav5pu2u00flxl7pjgpn7vjm5gyqde48e3 # non-NixOS

  # host keys
  - &host_ulthc    age1cqxpx2mgs4ae5dpgrf62qzf6sxephv2dtaw24el5py7yj9va44qsqky4fd
  - &host_sheba    age1sjh23dru0w6c4gz9slmx0td0hxsv2xterymcycgc9dvc4e2plq4qh2jed3
  - &host_uhvhc    age1zdq30907xjr2rhd5hagy20seg4tuk9chr4f8atgatmcs65xz5pwq32suue

creation_rules:
  - path_regex: secrets/secrets\.yaml$
    key_groups:
      - age:
          - *hcvst_uwshc
          - *hcvst_sheba
          - *hcvst_ultkv
          - *hcvst_generic
          - *host_ulthc
          - *host_sheba
          - *host_uhvhc
